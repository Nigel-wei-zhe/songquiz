<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050C">
<title>題庫標記</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050C;--glass:#120A1A;--pink:#ff2fae;--pinkL:#ff8ad8;--core:#fff6fc;--cyan:#14c8ff;--cyanL:#7fe9ff;--amber:#ffc35a;--red:#ff4d5e;--green:#4dffa6;--dim:#8a7f99;
  --pt:env(safe-area-inset-top);--pb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#eee;font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;padding:calc(10px + var(--pt)) 14px calc(16px + var(--pb))}
.num{font-family:"DotGothic16",monospace;color:var(--amber)}
button{font:inherit;color:#eee;background:var(--glass);border:2px solid #3a2a48;border-radius:12px;padding:10px 8px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#tabs{display:flex;gap:8px;align-items:center}
#tabs button{padding:6px 14px;border-radius:999px;font-size:14px;color:#a99bb8}
#tabs button.on{border-color:var(--cyanL);color:#fff;box-shadow:0 0 8px var(--cyan)}
#prog{margin-left:auto;font-size:13px;color:var(--dim)}
#pw{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#pw iframe,#player{position:absolute;inset:0;width:100%;height:100%}
#nav{display:flex;align-items:center;gap:8px}
#nav button{width:52px;flex:none;font-size:18px}
#ttl{flex:1;text-align:center;min-width:0}
#song{font-family:"Zen Maru Gothic";font-weight:900;font-size:22px;color:var(--core);text-shadow:0 0 10px var(--pink)}
#meta{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#time{display:flex;align-items:center;justify-content:center;gap:6px}
#now{font-size:30px;min-width:96px;text-align:center}
#time button{padding:8px 0;width:54px;font-size:13px}
#play{width:64px !important;font-size:18px !important;border-color:var(--pinkL) !important}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.mk b{font-size:15px}
.mk .v{font-size:18px;min-height:24px}
.mk.set{border-color:var(--green);box-shadow:0 0 8px #00e676}
.mk small{font-size:11px;color:var(--dim)}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tests button{font-size:13px;color:var(--cyanL);border-color:#2f5a6a;padding:8px 4px}
.tests button:disabled{opacity:.3}
#row2{display:flex;gap:8px}
#row2 button{flex:1}
#skip.on{border-color:var(--red);color:var(--red)}
#clr{color:var(--dim)}
#copy{border-color:var(--pinkL);color:var(--core);box-shadow:0 0 12px var(--pink);font-family:"Zen Maru Gothic";font-weight:900;font-size:18px;padding:14px}
#help{font-size:12px;color:var(--dim);line-height:1.7}
#out{width:100%;height:120px;background:var(--glass);color:#ddd;border:1px solid #3a2a48;border-radius:10px;font:12px/1.4 monospace;display:none}
#jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#jump::-webkit-scrollbar{display:none}
#jump button{flex:none;padding:4px 10px;font-size:12px;border-radius:999px;color:var(--dim)}
#jump button.done{border-color:#1e6a46;color:var(--green)}
#jump button.cur{border-color:var(--pinkL);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--pb));transform:translateX(-50%);background:var(--glass);border:1px solid var(--cyan);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:14px;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div id="tabs"><button data-k="o" class="on">原曲</button><button data-k="c">改編</button><span id="prog"></span></div>
  <div id="jump"></div>
  <div id="pw"><div id="player"></div></div>
  <div id="nav"><button id="prev">‹</button><div id="ttl"><div id="song"></div><div id="meta"></div></div><button id="next">›</button></div>
  <div id="time">
    <button data-d="-5">−5</button><button data-d="-1">−1</button>
    <span class="num" id="now">0:00</span>
    <button data-d="1">+1</button><button data-d="5">+5</button>
  </div>
  <div id="time2" style="display:flex;justify-content:center"><button id="play" style="width:64px">▶</button></div>
  <div class="marks" id="marks"></div>
  <div class="tests" id="tests"></div>
  <div id="row2"><button id="skip">剔除這首</button><button id="clr">清掉這首的標記</button></div>
  <button id="copy">複製結果（已標 <span id="cnt">0</span> 首）</button>
  <textarea id="out" readonly></textarea>
  <div id="help">播到位置後按上面的標記鈕，就記下目前的秒數；再按一次會改成新的秒數。標完一首直接按 › 換下一首。進度存在這支手機的瀏覽器裡，關掉再開還在。全部標完（或標一部分也行）按「複製結果」，貼給 Claude。</div>
</div>
<div id="toast"></div>
<script>
{
const MK = {
  o: [{k:'intro', n:'前奏起點', d:'前奏秒殺從這開始'}, {k:'start', n:'副歌起點', d:'其他關卡從這播'}, {k:'stop', n:'停點', d:'接下一句停在這'}],
  c: [{k:'start', n:'副歌起點', d:'從這開始播'}],
};
const LSK = 'sqMarks';
let data = {o: [], c: []}, tab = 'o', idx = {o: 0, c: 0}, player = null, ready = false, stopT = null;
let M = {}; try { M = JSON.parse(localStorage.getItem(LSK) || '{}'); } catch (e) {}
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const m = $('toast'); m.textContent = t; m.classList.add('on'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('on'), 1600); };
const persist = () => { try { localStorage.setItem(LSK, JSON.stringify(M)); } catch (e) {} };
const cur = () => data[tab][idx[tab]];
const mk = x => M[x.yt] || {};
const hasMark = x => Object.keys(mk(x)).length > 0;
const now = () => ready && player.getCurrentTime ? player.getCurrentTime() : 0;

function paint() {
  const x = cur(); if (!x) return;
  const m = mk(x), list = data[tab];
  $('song').textContent = x.song;
  $('meta').textContent = `${idx[tab] + 1}/${list.length}・${x.artist}${tab === 'c' ? '・' + (x.set || x.channel) : ''}`;
  $('marks').style.gridTemplateColumns = `repeat(${MK[tab].length},minmax(0,1fr))`;
  $('marks').innerHTML = MK[tab].map(d => `<button class="mk${m[d.k] != null ? ' set' : ''}" data-mk="${d.k}"><b>${d.n}</b><span class="num v">${m[d.k] != null ? fmt(m[d.k]) : ''}</span><small>${d.d}</small></button>`).join('');
  const T = tab === 'o'
    ? [['試前奏 1 秒', 'intro'], ['試副歌', 'start'], ['試停點', 'stop']]
    : [['試副歌', 'start']];
  $('tests').style.gridTemplateColumns = `repeat(${T.length},minmax(0,1fr))`;
  $('tests').innerHTML = T.map(([n, k]) => `<button data-t="${k}"${m[k] == null && k !== 'intro' ? ' disabled' : ''}>${n}</button>`).join('');
  $('skip').classList.toggle('on', !!m.skip);
  $('skip').textContent = m.skip ? '已剔除（按一下恢復）' : '剔除這首';
  const done = data.o.filter(hasMark).length + data.c.filter(hasMark).length;
  $('cnt').textContent = done;
  $('prog').textContent = `已標 ${list.filter(hasMark).length}/${list.length}`;
  $('jump').innerHTML = list.map((y, i) => `<button data-j="${i}" class="${hasMark(y) ? 'done' : ''}${i === idx[tab] ? ' cur' : ''}">${esc(y.song)}</button>`).join('');
  $('jump').querySelector('.cur')?.scrollIntoView({inline: 'center', block: 'nearest'});
}
function load() {
  const x = cur(); if (!x || !ready) return;
  clearTimeout(stopT);
  const m = mk(x);
  player.cueVideoById({videoId: x.yt, startSeconds: m.start ?? 0});
}
function go(d) { const n = idx[tab] + d; if (n < 0 || n >= data[tab].length) return; idx[tab] = n; paint(); load(); }
function playRange(a, len) { clearTimeout(stopT); player.seekTo(Math.max(0, a), true); player.playVideo(); if (len) stopT = setTimeout(() => player.pauseVideo(), len * 1000); }

$('tabs').onclick = e => { const k = e.target.dataset.k; if (!k) return; tab = k;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); paint(); load(); };
$('jump').onclick = e => { const j = e.target.dataset.j; if (j == null) return; idx[tab] = +j; paint(); load(); };
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
document.getElementById('time').onclick = e => { const d = e.target.dataset.d; if (!d || !ready) return; clearTimeout(stopT); player.seekTo(Math.max(0, now() + +d), true); };
$('play').onclick = () => { if (!ready) return; clearTimeout(stopT); player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); };
$('marks').onclick = e => { const b = e.target.closest('[data-mk]'); if (!b || !ready) return;
  const x = cur(); M[x.yt] = Object.assign(mk(x), {[b.dataset.mk]: Math.round(now() * 10) / 10}); persist(); paint();
  toast(`${b.querySelector('b').textContent}：${fmt(now())}`); };
$('tests').onclick = e => { const k = e.target.dataset.t; if (!k || !ready) return; const m = mk(cur());
  if (k === 'intro') playRange(m.intro ?? 0, 1);
  else if (k === 'start') playRange(m.start, 10);
  else playRange(m.stop - 8, 8); };
$('skip').onclick = () => { const x = cur(), m = mk(x); m.skip ? delete m.skip : m.skip = 1; M[x.yt] = m; if (!Object.keys(m).length) delete M[x.yt]; persist(); paint(); };
$('clr').onclick = () => { delete M[cur().yt]; persist(); paint(); toast('已清掉'); };
$('copy').onclick = async () => {
  // 只輸出秒數與剔除，沒有歌詞
  const line = (x, t) => { const m = mk(x); return [t, x.yt, x.song, m.intro ?? '', m.start ?? '', m.stop ?? '', m.skip ? '剔除' : ''].join('\t'); };
  const rows = [...data.o.filter(hasMark).map(x => line(x, '原曲')), ...data.c.filter(hasMark).map(x => line(x, '改編'))];
  if (!rows.length) return toast('還沒標任何一首');
  const txt = '#songquiz-marks v1\n類型\tyt\t歌名\t前奏\t副歌\t停點\t剔除\n' + rows.join('\n');
  try { await navigator.clipboard.writeText(txt); toast(`已複製 ${rows.length} 首，貼給 Claude 就好`); }
  catch (e) { $('out').style.display = 'block'; $('out').value = txt; $('out').select(); toast('請長按下面的文字全選複製'); }
};
setInterval(() => { if (ready && player.getCurrentTime) $('now').textContent = fmt(now()); $('play').textContent = ready && player.getPlayerState && player.getPlayerState() === 1 ? '❚❚' : '▶'; }, 250);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {playerVars: {playsinline: 1, rel: 0}, events: {onReady: () => { ready = true; load(); }}});
};
Promise.all([fetch('data/orig.json').then(r => r.json()), fetch('data/songs.json').then(r => r.json())])
  .then(([o, c]) => { data.o = o.filter(x => !x.skip); data.c = c.filter(x => !x.skip);
    // 從第一首還沒標的開始
    for (const k of ['o', 'c']) { const i = data[k].findIndex(x => !hasMark(x)); idx[k] = i < 0 ? 0 : i; }
    paint(); load(); });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
