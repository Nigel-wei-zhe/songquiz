<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07050C">
<title>原曲是哪首？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050C;--glass:#120A1A;--glass2:#1a1024;--line:#2a1d36;--pink:#ff2fae;--pinkL:#ff8ad8;--core:#fff6fc;--cyan:#14c8ff;--cyanL:#7fe9ff;--amber:#ffc35a;--red:#ff4d5e;--green:#4dffa6;
  --tx2:#b3a6c4;--tx3:#8f82a3;--dim:#8f82a3;--pt:env(safe-area-inset-top);--pb:env(safe-area-inset-bottom);--w:440px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#eee;font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% -10%,#3a0f3a 0%,transparent 55%),radial-gradient(ellipse at 50% 120%,#0b2a3a 0%,transparent 55%),var(--bg)}
::selection{background:#ff2fae55;color:#fff}
svg{display:block;flex:none}
.neon{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:var(--core);text-shadow:0 0 4px var(--pinkL),0 0 12px var(--pink),0 0 28px var(--pink)}
.neonC{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:#effcff;text-shadow:0 0 4px var(--cyanL),0 0 12px var(--cyan)}
.num{font-family:"DotGothic16",monospace;color:var(--amber);font-variant-numeric:tabular-nums}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(14px + var(--pt)) 18px calc(16px + var(--pb));gap:12px;overflow-y:auto;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:flex}
.scr>*{width:100%;max-width:var(--w);flex:none}
button{font:inherit;color:#eee;background:var(--glass);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;touch-action:manipulation;transition:border-color .2s,box-shadow .2s,background .2s,color .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cyanL);outline-offset:2px}
.big{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:22px;letter-spacing:.15em;text-indent:.15em;height:62px;padding:0 18px 2px;border-radius:18px}
.main{border:2px solid var(--pinkL);color:var(--core);background:linear-gradient(#2a0a26,#16061a);box-shadow:0 0 0 2px #5a2a50,0 0 16px var(--pink),inset 0 0 14px rgba(255,47,174,.5);text-shadow:0 0 8px var(--pink)}
.sub{border-color:#1f4f60;color:var(--cyanL)}
.ghost{background:none;border:0;color:var(--tx3);font-size:13px;padding:8px 12px}
.row{display:flex;gap:10px}
.row>button{flex:1;min-width:0}

/* ===== 開場 ===== */
#setup{padding-bottom:0;gap:0}
.hero{text-align:center;padding:14px 0 6px}
#title{font-size:38px;line-height:1.2}
#tagline{color:var(--tx2);font-size:13px;margin-top:4px}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.lbl{display:flex;align-items:baseline;gap:8px;color:var(--cyanL);font-size:13px;font-weight:700;letter-spacing:.08em}
.lbl small{color:var(--tx3);font-weight:400;letter-spacing:0}
.lbl a{margin-left:auto;color:var(--pinkL);text-decoration:none;font-weight:400;letter-spacing:0;display:flex;align-items:center;gap:2px}
#plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{position:relative}
.pl input{width:100%;height:46px;font:inherit;font-size:16px;color:#fff;caret-color:var(--pinkL);background:var(--glass);border:1.5px solid var(--line);border-radius:12px;padding:0 38px 0 14px;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .2s}
.pl input:focus{border-color:var(--pinkL)}
.pl button{position:absolute;right:3px;top:3px;width:40px;height:40px;padding:0;border:0;background:none;color:var(--tx3);display:grid;place-items:center}
#addP{height:44px;padding:0;border-style:dashed;color:var(--tx2);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
#modes{display:flex;flex-direction:column;gap:8px}
.md{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;color:var(--tx2)}
.md .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a3a5a;display:grid;place-items:center;font:13px "DotGothic16";color:transparent;flex:none}
.md .tx{flex:1;min-width:0}
.md b{display:block;font-size:16px;color:#d8cde6}
.md span.d{display:block;font-size:12.5px;color:var(--tx3);line-height:1.5;margin-top:1px}
.md.on{border-color:#3d8fa8;background:#0d1a24}
.md.on .ck{border-color:var(--cyanL);background:var(--cyan);color:#04121a;box-shadow:0 0 8px var(--cyan)}
.md.on b{color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:40px;padding:0 15px;border-radius:999px;font-size:15px;color:var(--tx2)}
.pill.on{border-color:var(--cyanL);color:#fff;background:#0d1a24;box-shadow:inset 0 0 8px rgba(20,200,255,.35)}
.pill small{font:12px "DotGothic16";color:var(--tx3);margin-left:5px}
.pill.on small{color:var(--amber)}
#nq{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--glass);border:1.5px solid var(--line);border-radius:14px}
#nq .pill{height:38px;border:0;border-radius:10px;background:none;padding:0}
#nq .pill.on{background:#0d1a24;box-shadow:inset 0 0 0 1.5px var(--cyanL)}
.dockb{position:sticky;bottom:0;margin-top:auto;padding:22px 0 calc(16px + var(--pb));background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px}

/* ===== 關卡卡片 ===== */
#card{justify-content:center;text-align:center;gap:16px}
#cardNo{color:var(--cyanL);letter-spacing:.3em;text-indent:.3em;font-size:14px}
#cardT{font-size:44px;line-height:1.2;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#cardD{color:var(--tx2);max-width:340px;margin:0 auto}
.ladder{display:flex;gap:6px;justify-content:center}
.ladder i{flex:1;max-width:110px;font-style:normal;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--glass);color:var(--tx3);font-size:13px;transition:all .25s}
.ladder i b{font:24px/1.1 "DotGothic16";color:var(--tx3);font-weight:400}
.ladder i b::after{content:'分';font:12px "Noto Sans TC";margin-left:2px}
.ladder i.on{border-color:var(--pinkL);color:#fff;background:#25102d;box-shadow:0 0 12px #ff2fae66}
.ladder i.on b{color:var(--amber)}
.ladder i.done{opacity:.4}
#cardPts i{color:var(--tx2)}#cardPts i b{color:var(--amber)}
#card .dockb{position:static;background:none;padding:12px 0 0;margin-top:0}

/* ===== 遊戲中 ===== */
#game{gap:10px}
#top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx3)}
#top .q{font-size:18px}
#modeTag{color:var(--cyanL);font-size:13px;border:1px solid #1f4f60;border-radius:999px;padding:2px 10px;white-space:nowrap;margin-right:auto}
#quit{height:34px;padding:0 12px;font-size:13px;color:var(--tx3);border-radius:10px}
#quit[data-arm]{border-color:var(--red);color:var(--red)}
#prog{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#prog i{display:block;height:100%;background:var(--pinkL);box-shadow:0 0 6px var(--pink);transition:width .4s}
#stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1.5px solid var(--line);margin-top:4px}
#player,#stage iframe{position:absolute;inset:0;width:100%;height:100%}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 45%,#2a0f2e,#0b0610 70%);z-index:2}
#cover.off{display:none}
#ring{--p:0;width:124px;height:124px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--pink) calc(var(--p)*1turn),#2a1d36 0);box-shadow:0 0 20px rgba(255,47,174,.35)}
#ring{border:0;padding:0;cursor:pointer;transition:box-shadow .2s}
#ring:active{transform:scale(.95)}
#ring>div{width:104px;height:104px;border-radius:50%;background:#0d0712;display:grid;place-items:center;font-size:42px;color:var(--amber)}
#ring svg{color:var(--pinkL);filter:drop-shadow(0 0 6px var(--pink))}
#ring.idle{background:conic-gradient(var(--pink) 1turn,#2a1d36 0);box-shadow:0 0 28px rgba(255,47,174,.55)}
#coverTx{font-size:14px;color:var(--tx2);min-height:21px}
#eq{display:flex;gap:4px;height:18px;align-items:flex-end}
#eq i{width:5px;background:var(--cyan);border-radius:3px;height:30%;box-shadow:0 0 6px var(--cyan)}
#eq.go i{animation:eq .8s ease-in-out infinite alternate}
#eq i:nth-child(2){animation-delay:-.3s}#eq i:nth-child(3){animation-delay:-.6s}#eq i:nth-child(4){animation-delay:-.15s}#eq i:nth-child(5){animation-delay:-.45s}
@keyframes eq{to{height:100%}}
.pane{flex:1 0 auto;display:flex;flex-direction:column;gap:12px}
#ask{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--tx2);margin-top:4px}
#askTx{font-weight:700;color:#fff}
#ptNow{display:none;font-family:"Zen Maru Gothic";font-weight:900;font-size:13px;color:#1a1000;background:var(--amber);border-radius:999px;padding:1px 10px;box-shadow:0 0 10px #ffc35a88}
#ptNow.x2{display:inline-block}
#hint{text-align:center;font-size:24px;min-height:36px;line-height:1.3}
#hint small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:14px;color:var(--tx2);text-shadow:none;letter-spacing:0;margin-top:4px}
#ask,#ans{margin-top:auto !important}
.ctl{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:10px}
#bStep{display:none;align-items:center;justify-content:space-between;height:54px;padding:0 18px;border-radius:16px;border-color:#4a3a5a;background:var(--glass2);color:#fff;font-size:17px;font-weight:700}
#bStep.on{display:flex}
#bStep .l{display:flex;align-items:center;gap:8px}
#bStep .l svg{color:var(--tx2)}
#bStep .pt{font:22px/1 "DotGothic16";color:var(--amber);font-weight:400}
#bStep .pt::after{content:'分';font:12px "Noto Sans TC";margin-left:2px;color:var(--tx2)}
#bBad{align-self:center}

/* ===== 公布 ===== */
#ans{text-align:center;margin-top:4px}
#ansAsk{color:var(--cyanL);font-size:13px;letter-spacing:.1em}
#ansBig{font-size:36px;line-height:1.25;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#ansMeta{color:#ddd;font-size:16px;margin-top:4px}
#ansMeta .y{color:var(--amber);font-family:"DotGothic16"}
#ansStyle{display:inline-block;color:var(--cyanL);font-size:12px;margin-top:6px;border:1px solid #1f4f60;border-radius:999px;padding:1px 10px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#bOrig{align-self:center;height:38px;padding:0 16px;font-size:14px;display:flex;align-items:center;gap:6px}
/* 回報（預設收合） */
#fb{display:flex;flex-direction:column;align-items:center;gap:6px}
#fbT{display:flex;align-items:center;gap:5px;padding:6px 12px}
#fbT.has{color:var(--amber)}
#fbBox{display:none;flex-direction:column;align-items:center;gap:8px}
#fbBox.open{display:flex}
#fbWho{font-size:12px;color:var(--tx3);text-align:center}
#fbTags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#fbTags .pill{height:36px;padding:0 11px;font-size:13px}
.fbCopy{align-self:center}
#fbOut{height:120px;font:12px monospace;color:#fff;background:var(--glass);border:1.5px solid var(--line);border-radius:12px;padding:8px;user-select:text;-webkit-user-select:text}
#whoT{color:var(--tx2);font-size:14px;margin-bottom:8px;text-align:center}
#whoT b{color:var(--amber);font-family:"DotGothic16";font-weight:400;font-size:15px}
#chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{height:62px;padding:0 6px;border-radius:14px;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--tx2)}
.chip>span:first-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{font-size:15px}
.chip.on{border-color:var(--green);color:#fff;background:#08201a;box-shadow:0 0 12px #00e67688,inset 0 0 10px rgba(0,230,118,.3)}
.chip.on .sc::after{content:" +" attr(data-pt);color:var(--green)}

/* ===== 結束 ===== */
#end{gap:14px}
#endK{text-align:center;color:var(--cyanL);font-size:13px;letter-spacing:.3em;text-indent:.3em;margin-top:18px}
#endT{font-size:40px;text-align:center;line-height:1.2;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#crown{margin:0 auto -4px;color:var(--amber);filter:drop-shadow(0 0 8px #ffc35a99)}
#rank{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rk{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:14px;background:var(--glass);border:1.5px solid var(--line);overflow:hidden}
.rk .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff2fae22,#ff2fae08);border-right:1px solid #ff2fae44}
.rk>*:not(.bar){position:relative}
.rk.w{border-color:var(--pinkL);box-shadow:0 0 14px #ff2fae77}
.rk .n{font-size:20px;width:22px;color:var(--tx3)}
.rk.w .n{color:var(--amber)}
.rk .nm{flex:1;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .s{font-size:24px}
#end .dockb{margin-top:auto}

#toast{position:fixed;left:50%;top:calc(16px + var(--pt));transform:translate(-50%,-8px);background:#0d1a24;border:1px solid var(--cyan);color:#fff;padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9;font-size:14px;white-space:nowrap;box-shadow:0 6px 20px #000a}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#eq.go i,#cardT,#ansBig,#endT{animation:none}#prog i,.ladder i{transition:none}}
</style>
</head>
<body>

<!-- 開場 -->
<section class="scr on" id="setup">
  <div class="hero">
    <div id="title" class="neon">原曲是哪首？</div>
    <div id="tagline">原曲、改編混著來，看誰耳朵最靈</div>
  </div>

  <div class="sec">
    <div class="lbl">玩家</div>
    <div id="plist"></div>
    <button id="addP"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>加一位</button>
  </div>

  <div class="sec">
    <div class="lbl">關卡</div>
    <div id="modes"></div>
  </div>

  <div class="sec">
    <div class="lbl">題庫<a href="list.html">看題庫<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a></div>
    <div class="pills" id="sets"></div>
  </div>

  <div class="sec">
    <div class="lbl">年代<small>各年代平均出題</small></div>
    <div class="pills" id="eras"></div>
  </div>

  <div class="sec">
    <div class="lbl">題數</div>
    <div id="nq"></div>
  </div>


  <div class="dockb">
    <button class="big main" id="start">開始</button>
    <button class="ghost fbCopy" hidden></button>
  </div>
</section>

<!-- 關卡卡片 -->
<section class="scr" id="card">
  <div id="cardNo"></div>
  <div id="cardT" class="neon"></div>
  <div id="cardD"></div>
  <div id="cardPts" class="ladder"></div>
  <div class="dockb"><button class="big main" id="bCard">開始這關</button></div>
</section>

<!-- 遊戲中（播放與公布共用，播放器 iframe 不搬動） -->
<section class="scr" id="game">
  <div id="top"><span>第 <span class="num q" id="qn">1</span> / <span class="num" id="qt">10</span> 題</span><span id="modeTag"></span><button id="quit">結束</button></div>
  <div id="prog"><i></i></div>
  <div id="stage">
    <div id="player"></div>
    <div id="cover">
      <button id="ring" aria-label="播放這段"><div class="num"><span id="sec">0</span></div></button>
      <div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="coverTx"></div>
    </div>
  </div>
  <div id="pPlay" class="pane">
    <div id="ask"><span id="askTx"></span><span id="ptNow"></span></div>
    <div id="steps" class="ladder"></div>
    <div id="hint" class="neonC"></div>
    <div class="ctl">
      <button id="bStep"></button>
      <button class="big main" id="bMain">播放</button>
      <button class="ghost" id="bBad">換一首</button>
    </div>
  </div>
  <div id="pRev" class="pane" style="display:none">
    <div id="ans">
      <div id="ansAsk"></div>
      <div id="ansBig" class="neon"></div>
      <div id="ansMeta"></div>
      <div id="ansStyle"></div>
    </div>
    <button class="sub" id="bOrig"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>聽原曲對照</button>
    <div id="who"><div id="whoT"></div><div id="chips"></div></div>
    <div id="fb">
      <button class="ghost" id="fbT" aria-expanded="false" aria-controls="fbBox"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h13l-2.5 4.5L18 13H5"/></svg>回報</button>
      <div id="fbBox"><div id="fbWho"></div><div id="fbTags"></div></div>
    </div>
    <div class="ctl"><button class="big main" id="bNext">下一題</button></div>
  </div>
</section>

<!-- 結束 -->
<section class="scr" id="end">
  <div id="endK">最終排名</div>
  <svg id="crown" width="44" height="34" viewBox="0 0 44 34" fill="currentColor"><path d="M4 28 1 7l11 8L22 1l10 14 11-8-3 21z"/><rect x="4" y="30" width="36" height="4" rx="1.5"/></svg>
  <div id="endT" class="neon"></div>
  <div id="rank"></div>
  <div class="dockb">
    <button class="big main" id="bReplay">再來一局</button>
    <button class="ghost" id="bHome">回到設定</button>
    <button class="ghost fbCopy" hidden></button>
  </div>
</section>

<div id="toast"></div>

<script>
{
// ===== 資料與設定 =====
const SETS = [ // 題庫分類（使用者定：黑杰倫／翻唱／原唱）；前兩類在 songs.json，原唱是 orig.json
  {k:'bj',   n:'黑杰倫'},
  {k:'cover',n:'翻唱'}, // 黑杰倫以外的改編都算
  {k:'orig', n:'原唱'},
];
// 年代：以原曲首次發行年分；同一首歌的原曲、改編共用年份
const ERAS = [{k:'e80', n:'80 年代以前', to:1989}, {k:'e90', n:'90 年代', to:1999}, {k:'e00', n:'2000 年代', to:2009}, {k:'e10', n:'2010 後', to:9999}];
// 關卡：每一段（step）有自己的影片、長度、分數、提示
const MODES = {
  intro: {n:'前奏秒殺', ask:'猜歌名', d:'聽前奏猜歌名',
          pts:[['3 秒',3],['6 秒',2],['12 秒',1]]},
  ladder:{n:'改編三段式', ask:'猜歌名', d:'聽改編版猜歌名',
          pts:[['改編',3],['改編＋提示',2],['原曲',1]]},
  next:  {n:'接下一句', ask:'唱出下一句', d:'接唱下一句',
          pts:[['接對',2]]},
  artist:{n:'猜原唱', ask:'猜原唱是誰', d:'猜原本是誰唱的',
          pts:[['改編',2],['給歌名',1]]},
};
const ORDER = ['intro', 'ladder', 'artist']; // 'next'（接下一句）使用者覺得太難，先不開
const hasStop = o => o.stop != null && o.stop > 3;
const hasIntro = o => !o.mvOnly; // 只有 MV 的新歌開頭可能是片頭，不拿來猜前奏
const DEF_START = 30, CLIP = 20;
const LS = 'sqCfg3', LSP = 'sqPlayed', LSF = 'sqFeedback';
let ALL = [], ORIG = [];
let cfg = {players:['玩家 1','玩家 2','玩家 3'], sets:SETS.map(s => s.k), eras:ERAS.map(e => e.k), modes:[...ORDER], nq:10};
try { Object.assign(cfg, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
if (!cfg.sets.length || cfg.sets.some(k => !SETS.some(s => s.k === k))) cfg.sets = SETS.map(s => s.k); // 舊版分組 → 全選
if (!cfg.eras?.length || cfg.eras.some(k => !ERAS.some(e => e.k === k))) cfg.eras = ERAS.map(e => e.k);
let G = null, player = null, ytReady = false, loaded = '', stopAt = 0, tick = null, wake = null;
window.__dbg = {get G() { return G; }, get ORIG() { return ORIG; }}; // 測試用

const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id));
const toast = t => { const m = $('toast'); m.textContent = t; m.classList.add('on'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('on'), 1800); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save = () => { try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch (e) {} };
const setOf = x => SETS[(x.set || x.channel) === '黑杰倫' ? 0 : 1];
let YEAR = {};
const yearOf = x => x.year || YEAR[x.song];
const eraOf = x => { const y = yearOf(x); return y ? ERAS.find(e => y <= e.to).k : ''; };
// 沒有年份的歌只在年代全選時出
const inEra = x => cfg.eras.length === ERAS.length || cfg.eras.includes(eraOf(x));
const covers = () => ALL.filter(x => !x.skip && cfg.sets.includes(setOf(x).k) && inEra(x));
const origs = () => cfg.sets.includes('orig') ? ORIG.filter(o => !o.skip && inEra(o)) : [];
const eraCount = e => new Set([...ALL, ...ORIG].filter(x => !x.skip && eraOf(x) === e.k).map(x => x.song)).size;
const setCount = s => s.k === 'orig' ? ORIG.filter(o => !o.skip).length : ALL.filter(x => !x.skip && setOf(x) === s).length;
// 各關需要的題庫：前奏秒殺只用原唱、改編三段式只用改編、猜原唱兩種都行
const canMode = k => k === 'intro' ? origs().some(hasIntro) : k === 'next' ? origs().length > 0 : k === 'ladder' ? covers().length > 0 : covers().length + origs().length > 0;
const origOf = song => ORIG.find(o => o.song === song && !o.skip);
const startOf = v => v.start != null ? v.start : DEF_START;

// ===== 開場 =====
function paintSetup() {
  const X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  $('plist').innerHTML = cfg.players.map((n, i) => `<div class="pl"><input value="${esc(n)}" data-i="${i}" maxlength="8" enterkeyhint="done" aria-label="玩家 ${i + 1} 名字"><button data-del="${i}" aria-label="移除 ${esc(n)}">${X}</button></div>`).join('');
  const on = ORDER.filter(k => cfg.modes.includes(k));
  $('modes').innerHTML = ORDER.map(k => { const m = MODES[k], n = on.indexOf(k);
    return `<button class="md${n >= 0 ? ' on' : ''}" data-md="${k}" aria-pressed="${n >= 0}"><span class="ck">${n >= 0 ? n + 1 : ''}</span><span class="tx"><b>${m.n}</b><span class="d">${m.d}</span></span></button>`; }).join('');
  $('sets').innerHTML = SETS.map(s => { const c = setCount(s);
    return c ? `<button class="pill${cfg.sets.includes(s.k) ? ' on' : ''}" data-set="${s.k}">${s.n}<small>${c}</small></button>` : ''; }).join('');
  $('eras').innerHTML = ERAS.map(e => { const c = eraCount(e);
    return `<button class="pill${cfg.eras.includes(e.k) ? ' on' : ''}" data-era="${e.k}">${e.n}<small>${c}</small></button>`; }).join('');
  $('nq').innerHTML = [6, 10, 15, 20].map(n => `<button class="pill${cfg.nq === n ? ' on' : ''}" data-nq="${n}">${n} 題</button>`).join('');
}
$('plist').addEventListener('input', e => { if (e.target.dataset.i != null) { cfg.players[+e.target.dataset.i] = e.target.value; save(); } });
$('plist').addEventListener('click', e => {
  const d = e.target.closest('[data-del]')?.dataset.del; if (d == null) return;
  if (cfg.players.length <= 1) return toast('至少要一位玩家');
  cfg.players.splice(+d, 1); save(); paintSetup();
});
$('addP').onclick = () => { if (cfg.players.length >= 10) return toast('最多 10 位'); cfg.players.push('玩家 ' + (cfg.players.length + 1)); save(); paintSetup(); };
$('setup').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const tog = (arr, k) => { const i = arr.indexOf(k); i >= 0 ? arr.splice(i, 1) : arr.push(k); };
  if (b.dataset.md) tog(cfg.modes, b.dataset.md);
  else if (b.dataset.set) tog(cfg.sets, b.dataset.set);
  else if (b.dataset.era) tog(cfg.eras, b.dataset.era);
  else if (b.dataset.nq) cfg.nq = +b.dataset.nq;
  else return;
  save(); paintSetup();
});
$('start').onclick = () => {
  cfg.players = cfg.players.map((n, i) => n.trim() || '玩家 ' + (i + 1)); save();
  if (!cfg.modes.length) return toast('至少選一個關卡');
  if (!cfg.sets.length) return toast('至少選一個題庫');
  if (!cfg.eras.length) return toast('至少選一個年代');
  const bad = cfg.modes.filter(k => !canMode(k));
  if (bad.length === cfg.modes.length) return toast(bad.includes('intro') ? '前奏秒殺要勾「原唱」' : '改編三段式要勾「黑杰倫」或「翻唱」');
  if (bad.length) toast(`略過${bad.map(k => MODES[k].n).join('、')}（題庫沒勾到）`);
  newGame();
};

// ===== 出題 =====
// 配額：每局同一原唱最多約 1/5 的題數（至少 2 題）；合唱的每位都算一次
const singers = x => String(x.artist).replace(/[（(].*?[）)]/g, '').split(/[、,&\/]| feat\.? /).map(a => a.trim()).filter(Boolean);
const artistCap = () => Math.max(2, Math.ceil(cfg.nq / 5));
const countSingers = qs => qs.reduce((m, q) => { singers(q).forEach(a => m[a] = (m[a] || 0) + 1); return m; }, {});
const underCap = (x, count) => singers(x).every(a => (count[a] || 0) < artistCap());
function buildQuestions() {
  let played = [];
  try { played = JSON.parse(localStorage.getItem(LSP) || '[]'); } catch (e) {}
  const modes = ORDER.filter(k => cfg.modes.includes(k) && canMode(k));
  const per = modes.map((k, i) => Math.floor(cfg.nq / modes.length) + (i < cfg.nq % modes.length ? 1 : 0));
  const used = new Set(), qs = [];
  const fresh = arr => { const f = arr.filter(x => !played.includes(x.yt)), o = arr.filter(x => played.includes(x.yt));
    const sh = a => a.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
    return [...sh(f), ...sh(o)]; };
  modes.forEach((k, mi) => {
    let cand;
    if (k === 'intro') cand = fresh(origs().filter(hasIntro));
    else if (k === 'ladder') { const c = fresh(covers()); cand = [...c.filter(x => origOf(x.song)), ...c.filter(x => !origOf(x.song))]; }
    else if (k === 'next') cand = fresh(origs().filter(hasStop));
    else { // 猜原唱：約三分之一出原曲
      const c = fresh(covers()), o = fresh(origs());
      cand = []; while (c.length || o.length) { if (o.length && (cand.length % 3 === 2 || !c.length)) cand.push(o.shift()); else cand.push(c.shift()); }
    }
    let n = 0;
    // 每次從目前出最少的年代挑（各年代平均）；先照配額，題庫太窄湊不滿時第二輪放寬
    for (const strict of [true, false]) while (n < per[mi]) {
      const eras = {}; qs.forEach(q => eras[q.era] = (eras[q.era] || 0) + 1);
      const load = x => eraOf(x) ? eras[eraOf(x)] || 0 : Infinity; // 沒年份的墊後
      let x = null;
      for (const c of cand) if (!used.has(c.song) && (!strict || underCap(c, countSingers(qs))) && (!x || load(c) < load(x))) x = c;
      if (!x) break;
      used.add(x.song); qs.push(makeQ(k, x)); n++;
    }
  });
  if (qs.length) qs[qs.length - 1].x2 = true;
  try { localStorage.setItem(LSP, JSON.stringify([...played.filter(y => !qs.some(q => q.ids.includes(y))), ...qs.flatMap(q => q.ids)].slice(-400))); } catch (e) {}
  return qs;
}
function makeQ(mode, x) {
  const chars = [...x.song], h1 = `${chars.length} 個字，第一個字「${esc(chars[0])}」`;
  let steps;
  if (mode === 'intro') steps = [3, 6, 12].map((len, i) => ({v: x, start: x.intro || 0, len, pt: 3 - i}));
  else if (mode === 'ladder') { const o = origOf(x.song);
    steps = [{v: x, start: startOf(x), len: CLIP, pt: 3}, {v: x, start: startOf(x), len: CLIP, pt: 2, hint: h1},
             o ? {v: o, start: startOf(o), len: CLIP, pt: 1, hint: h1, tag: '原曲'} : {v: x, start: startOf(x), len: CLIP, pt: 1, hint: h1 + `<small>原唱：${esc(x.artist)}</small>`}]; }
  else if (mode === 'next') { // 從副歌起點唱到停點；太短就往前多給 8 秒
    const a = x.start != null && x.stop - x.start >= 3 ? x.start : Math.max(0, x.stop - 8);
    steps = [{v: x, start: a, len: x.stop - a, pt: 2}]; }
  else if (x.orig) steps = [{v: x, start: startOf(x), len: CLIP, pt: 1}];
  else steps = [{v: x, start: startOf(x), len: CLIP, pt: 2}, {v: x, start: startOf(x), len: CLIP, pt: 1, hint: `歌名是「${esc(x.song)}」`}];
  return {mode, song: x.song, artist: x.artist, year: yearOf(x), era: eraOf(x), style: x.orig ? '原曲' : x.style, steps, ids: steps.map(s => s.v.yt), cover: x.orig ? null : x, orig: x.orig ? x : origOf(x.song)};
}

function newGame() {
  const qs = buildQuestions();
  if (!qs.length) return toast('題庫不夠，換個選擇');
  G = {qs, i: 0, score: cfg.players.map(() => 0)};
  $('qt').textContent = qs.length;
  keepAwake();
  nextQ();
}
function nextQ() { // 換關時先出卡片
  const q = G.qs[G.i], prev = G.qs[G.i - 1];
  if (!prev || prev.mode !== q.mode) return roundCard(q.mode);
  question();
}
function roundCard(k) {
  const m = MODES[k], mods = [...new Set(G.qs.map(q => q.mode))];
  $('cardNo').textContent = `第 ${'一二三四'[mods.indexOf(k)]} 關`;
  $('cardT').textContent = m.n;
  $('cardD').textContent = m.d;
  $('cardNo').textContent += `・共 ${mods.length} 關`;
  $('cardPts').innerHTML = m.pts.map(([n, p]) => `<i>${n}<b>${p}</b></i>`).join('');
  $('cardT').style.animation = 'none'; void $('cardT').offsetWidth; $('cardT').style.animation = '';
  stopVid();
  show('card');
}
$('bCard').onclick = () => question();

// ===== 一題：ready → play → pause →（下一段）… → reveal =====
function question() {
  const q = G.qs[G.i];
  G.st = 'ready'; G.step = 0; G.got = new Set();
  $('qn').textContent = G.i + 1;
  $('prog').firstChild.style.width = (G.i / G.qs.length * 100) + '%';
  $('modeTag').textContent = MODES[q.mode].n;
  phase('play');
  $('cover').classList.remove('off');
  paintStep();
  $('hint').innerHTML = '';
  $('coverTx').textContent = '';
  ring('play');
  $('eq').classList.remove('go');
  $('bMain').textContent = '播放';
  show('game');
  cue(q.steps[0]);
}
// 圓環中央：播放前▶、時間到↻（點圓環＝播這段），播放中顯示秒數
const ICON = {
  play: '<svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  again: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>',
  next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg>',
};
function ring(k) { const r = $('ring'); r.classList.toggle('idle', k !== 'num'); r.dataset.k = k;
  if (k === 'num') { if (!$('sec')) r.firstChild.innerHTML = '<span id="sec"></span>'; }
  else r.firstChild.innerHTML = ICON[k];
  r.setAttribute('aria-label', k === 'again' ? '重聽這段' : '播放這段'); }
$('ring').onclick = () => { if (G && G.st !== 'reveal') playStep(); };
const ptOf = q => q.steps[G.step].pt * (q.x2 ? 2 : 1);
function paintStep() {
  const q = G.qs[G.i], s = q.steps[G.step], nx = q.steps[G.step + 1];
  $('askTx').textContent = MODES[q.mode].ask;
  $('ptNow').textContent = '最後一題・雙倍';
  $('ptNow').classList.toggle('x2', !!q.x2);
  const lab = st => q.mode === 'intro' ? st.len + ' 秒' : st.tag || (st.hint ? '＋提示' : st.v.orig ? '原曲' : '改編');
  $('steps').innerHTML = q.steps.map((st, i) => `<i class="${i === G.step ? 'on' : i < G.step ? 'done' : ''}">${lab(st)}<b>${st.pt * (q.x2 ? 2 : 1)}</b></i>`).join('');
  if ($('sec')) $('sec').textContent = s.len;
  $('ring').style.setProperty('--p', 0);
  $('bStep').innerHTML = nx ? `<span class="l">${ICON.next}${q.mode === 'intro' ? '再放 ' + nx.len + ' 秒' : nx.tag ? '換聽原曲' : '給提示'}</span><span class="pt">${nx.pt * (q.x2 ? 2 : 1)}</span>` : '';
  $('bStep').classList.toggle('on', !!nx && G.st === 'pause');
  if (s.hint) $('hint').innerHTML = s.hint;
}

function cue(s) { if (!ytReady) return; player.cueVideoById({videoId: s.v.yt, startSeconds: s.start}); loaded = s.v.yt; }
function stopVid() { clearInterval(tick); if (ytReady) player.pauseVideo(); }
function playStep() {
  const q = G.qs[G.i], s = q.steps[G.step];
  if (!ytReady) return toast('播放器還沒準備好，稍等一下');
  stopAt = s.start + s.len; G.wait = 0;
  if (loaded === s.v.yt) { player.seekTo(s.start, true); player.playVideo(); }
  else { player.loadVideoById({videoId: s.v.yt, startSeconds: s.start}); loaded = s.v.yt; }
  G.st = 'play';
  $('eq').classList.add('go');
  $('coverTx').textContent = '';
  if (!s.hint) $('hint').innerHTML = '';
  ring('num');
  $('bMain').textContent = '公布答案';
  paintStep();
  clearInterval(tick); tick = setInterval(onTick, 50);
}
function onTick() {
  if (!ytReady || G.st !== 'play') return;
  const s = G.qs[G.i].steps[G.step];
  if (player.getPlayerState() !== 1) { // 緩衝中不倒數；卡太久多半是被擋自動播放
    G.wait++; $('coverTx').textContent = '載入中…'; if (G.wait > 60 && $('ring').dataset.k !== 'again') ring('again'); return;
  }
  if ($('ring').dataset.k !== 'num') ring('num');
  G.wait = 0; $('coverTx').textContent = '';
  const left = Math.max(0, stopAt - player.getCurrentTime());
  $('sec').textContent = Math.ceil(left);
  $('ring').style.setProperty('--p', Math.min(1, 1 - left / s.len));
  if (left <= 0.04) {
    player.pauseVideo(); G.st = 'pause'; clearInterval(tick);
    $('eq').classList.remove('go');
    ring('again'); paintStep();
    if (s.len > 5) beep();
  }
}
$('bMain').onclick = () => { G.st === 'ready' ? playStep() : reveal(); };
$('bStep').onclick = () => { G.step++; playStep(); };
$('bBad').onclick = () => { const q = G.qs[G.i]; record(q.steps[0].v, q.mode, 'swap'); skipBad(); };
function skipBad() { // 換一首同關卡的
  const q = G.qs[G.i], used = new Set(G.qs.map(x => x.song));
  let cand = q.mode === 'intro' ? origs().filter(hasIntro) : q.mode === 'next' ? origs().filter(hasStop) : covers();
  cand = cand.filter(x => !used.has(x.song)).sort(() => Math.random() - .5);
  const count = countSingers(G.qs.filter((_, i) => i !== G.i));
  const rank = x => (underCap(x, count) ? 0 : 2) + (eraOf(x) === q.era ? 0 : 1); // 先守配額，再找同年代
  cand.sort((a, b) => rank(a) - rank(b));
  stopVid();
  if (cand[0]) { const nq = makeQ(q.mode, cand[0]); nq.x2 = q.x2; G.qs[G.i] = nq; toast('換了一首'); question(); }
  else { G.qs.splice(G.i, 1); $('qt').textContent = G.qs.length; G.i < G.qs.length ? question() : finish(); }
}

// ===== 公布 =====
function reveal() {
  const q = G.qs[G.i];
  clearInterval(tick);
  if (G.st !== 'play') player.playVideo(); // 公布時讓歌繼續播
  G.st = 'reveal'; G.pt = ptOf(q); G.heardOrig = false;
  phase('rev');
  $('cover').classList.add('off');
  $('eq').classList.remove('go');
  const art = q.mode === 'artist';
  $('ansAsk').textContent = art ? '原唱是' : '這首是';
  $('ansBig').textContent = art ? q.artist : q.song;
  $('ansBig').style.animation = 'none'; void $('ansBig').offsetWidth; $('ansBig').style.animation = '';
  $('ansMeta').innerHTML = (art ? esc(q.song) : esc(q.artist)) + (q.year ? '　<span class="y">' + esc(q.year) + '</span>' : '');
  const playing = q.steps[G.step];
  $('ansStyle').textContent = playing.tag || (playing.v.orig ? '原曲' : (playing.v.style || '改編'));
  // 正在播改編、又有原曲 → 可以接著聽原曲對照
  const o = q.orig;
  $('bOrig').style.display = o && !playing.v.orig ? '' : 'none';
  $('prog').firstChild.style.width = ((G.i + 1) / G.qs.length * 100) + '%';
  $('whoT').innerHTML = `誰答對？<b>+${G.pt}</b>`;
  paintChips();
  foldFb();
}
$('bOrig').onclick = () => { const o = G.qs[G.i].orig; if (!o) return;
  player.loadVideoById({videoId: o.yt, startSeconds: startOf(o)}); loaded = o.yt;
  $('ansStyle').textContent = '原曲'; $('bOrig').style.display = 'none'; G.heardOrig = true; foldFb(); };
function paintChips() {
  $('chips').innerHTML = cfg.players.map((n, i) => `<button class="chip${G.got.has(i) ? ' on' : ''}" data-p="${i}" aria-pressed="${G.got.has(i)}"><span>${esc(n)}</span><span class="num sc" data-pt="${G.pt}">${G.score[i]}</span></button>`).join('');
  const last = G.i + 1 >= G.qs.length;
  $('bNext').textContent = G.got.size ? (last ? '看排名' : '下一題') : (last ? '沒人答對・看排名' : '沒人答對・下一題');
  $('bNext').style.fontSize = G.got.size ? '' : '19px';
}
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const i = +b.dataset.p; G.got.has(i) ? G.got.delete(i) : G.got.add(i); paintChips();
};
$('bNext').onclick = () => {
  if (!G.got.size) { const q = G.qs[G.i]; record(q.steps[0].v, q.mode, 'miss'); }
  G.got.forEach(i => G.score[i] += G.pt);
  stopVid();
  G.i++;
  G.i < G.qs.length ? nextQ() : finish();
};
function phase(k) {
  $('pPlay').style.display = k === 'play' ? 'flex' : 'none';
  $('pRev').style.display = k === 'rev' ? 'flex' : 'none';
  $('quit').style.visibility = k === 'play' ? 'visible' : 'hidden';
}

// ===== 回報 =====
// 紀錄存手機（以影片 ID 彙整）：tags 是手動回報，swap／error／miss 自動累計
const TAGS = [['start', '起點不好'], ['unknown', '認不出來'], ['drop', '刪掉這首'], ['data', '資料錯了']];
let FB = {};
try { FB = JSON.parse(localStorage.getItem(LSF) || '{}') || {}; } catch (e) {}
const saveFb = () => { try { localStorage.setItem(LSF, JSON.stringify(FB)); } catch (e) {} paintCopy(); };
const videoOf = yt => ORIG.find(x => x.yt === yt) || ALL.find(x => x.yt === yt);
const entry = v => FB[v.yt] || (FB[v.yt] = {t: v.orig ? '原曲' : '改編', song: v.song, tags: {}});
const where = (v, mode) => `${MODES[mode].n}@${mode === 'intro' ? v.intro || 0 : startOf(v)}`;
function record(v, mode, k) { const r = entry(v); r[k] = (r[k] || 0) + 1; r.at = where(v, mode); saveFb(); }
// 手動回報對象＝這題出的版本；按過「聽原曲對照」就改成原曲
const fbVideo = () => { const q = G.qs[G.i]; return G.heardOrig ? q.orig : q.steps[0].v; };
function paintFb() {
  const v = fbVideo(), tags = FB[v.yt]?.tags || {};
  $('fbWho').textContent = `針對${v.orig ? '原曲' : '改編'}版「${v.song}」`;
  $('fbTags').innerHTML = TAGS.map(([k, n]) => `<button class="pill${tags[k] ? ' on' : ''}" data-fb="${k}" aria-pressed="${!!tags[k]}">${n}</button>`).join('');
  $('fbT').classList.toggle('has', Object.keys(tags).length > 0);
}
function foldFb(open = false) { $('fbBox').classList.toggle('open', open); $('fbT').setAttribute('aria-expanded', open); paintFb(); }
$('fbT').onclick = () => { foldFb(!$('fbBox').classList.contains('open')); if ($('fbBox').classList.contains('open')) $('fb').scrollIntoView({block: 'nearest'}); };
$('fbTags').onclick = e => {
  const k = e.target.closest('[data-fb]')?.dataset.fb; if (!k) return;
  const v = fbVideo(), r = entry(v), had = r.tags[k];
  if (had) delete r.tags[k]; else r.tags[k] = where(v, G.qs[G.i].mode);
  if (!Object.keys(r.tags).length && !r.swap && !r.error && !r.miss) delete FB[v.yt];
  saveFb(); foldFb(); toast(had ? '已取消' : '已記下');
};
function paintCopy() {
  const n = Object.keys(FB).length;
  document.querySelectorAll('.fbCopy').forEach(b => { b.hidden = !n; b.textContent = `複製回報（${n} 首）`; });
}
function fbText() {
  const rows = Object.entries(FB).map(([yt, r]) => [r.t, yt, r.song,
    TAGS.filter(([k]) => r.tags[k]).map(([k, n]) => `${n}（${r.tags[k]}）`).join('、'), r.swap || '', r.error || '', r.miss || '', r.at || ''].join('\t'));
  return '#songquiz-feedback v1\n類型\tyt\t歌名\t回報\t換掉\t播不了\t沒人答對\t最後自動紀錄\n' + rows.join('\n');
}
document.querySelectorAll('.fbCopy').forEach(b => b.onclick = async () => {
  const txt = fbText();
  try { await navigator.clipboard.writeText(txt); toast('已複製，貼給 Claude 就好'); }
  catch (e) { // 剪貼簿被擋：顯示文字讓人長按複製
    let o = $('fbOut'); if (!o) { o = document.createElement('textarea'); o.id = 'fbOut'; o.readOnly = true; }
    o.value = txt; b.after(o); o.select(); toast('請長按文字全選複製'); }
});
paintCopy();

// ===== 結束 =====
function finish() {
  stopVid();
  const ord = cfg.players.map((n, i) => ({n, s: G.score[i]})).sort((a, b) => b.s - a.s);
  const top = ord[0].s; let rk = 0, last = null;
  $('rank').innerHTML = ord.map((p, k) => { if (p.s !== last) { rk = k + 1; last = p.s; }
    return `<div class="rk${p.s === top && top > 0 ? ' w' : ''}"><span class="bar" style="width:${top > 0 ? Math.round(p.s / top * 100) : 0}%"></span><span class="num n">${rk}</span><span class="nm">${esc(p.n)}</span><span class="num s">${p.s}</span></div>`; }).join('');
  const champs = ord.filter(p => p.s === top);
  $('endT').textContent = top <= 0 ? '大家都沒得分' : champs.length > 1 ? `${champs.length} 人並列第一` : champs[0].n;
  $('crown').style.display = top > 0 ? '' : 'none';
  $('endT').style.animation = 'none'; void $('endT').offsetWidth; $('endT').style.animation = '';
  releaseAwake();
  show('end');
}
$('bReplay').onclick = () => newGame();
$('bHome').onclick = () => { paintSetup(); show('setup'); };
// 「結束」要按兩下確認（frame 裡 confirm() 不一定能用）
$('quit').onclick = () => {
  if ($('quit').dataset.arm) { delete $('quit').dataset.arm; $('quit').textContent = '結束'; finish(); return; }
  $('quit').dataset.arm = 1; $('quit').textContent = '再按一次結束';
  setTimeout(() => { delete $('quit').dataset.arm; $('quit').textContent = '結束'; }, 2500);
};

// ===== 雜項 =====
async function keepAwake() { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} }
function releaseAwake() { try { wake?.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && G && !$('end').classList.contains('on')) keepAwake(); });
let AC = null;
function beep() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach((d, k) => { const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = k ? 1320 : 880; o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime + d; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.start(t); o.stop(t + .17); });
  } catch (e) {}
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    playerVars: {playsinline: 1, rel: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3},
    events: {
      onReady: () => { ytReady = true; if (G && G.st === 'ready' && $('game').classList.contains('on')) cue(G.qs[G.i].steps[0]); },
      onError: () => { if (G && G.st !== 'reveal' && $('game').classList.contains('on')) { const q = G.qs[G.i]; record(videoOf(loaded) || q.steps[G.step].v, q.mode, 'error'); toast('這首播不了，自動換一首'); skipBad(); } }
    }
  });
};

Promise.all([
  fetch('data/songs.json').then(r => r.json()),
  fetch('data/orig.json').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([d, o]) => { ALL = d; ORIG = o;
  YEAR = Object.fromEntries([...ALL, ...ORIG].filter(x => x.year).map(x => [x.song, x.year]));
  paintSetup(); });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
