<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050C">
<title>題庫</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050C;--glass:#120A1A;--pink:#ff2fae;--pinkL:#ff8ad8;--core:#fff6fc;--cyan:#14c8ff;--cyanL:#7fe9ff;--amber:#ffc35a;--red:#ff4d5e;--dim:#8a7f99;
  --pt:env(safe-area-inset-top);--pb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#eee;font:15px/1.5 "Noto Sans TC",system-ui,sans-serif}
.num{font-family:"DotGothic16",monospace;color:var(--amber)}
button{font:inherit;color:#eee;background:var(--glass);border:2px solid #3a2a48;border-radius:12px;cursor:pointer;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(20px + var(--pb))}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--pt)) 0 8px;display:flex;flex-direction:column;gap:8px}
#hd{display:flex;align-items:center;gap:10px}
#hd a{color:var(--cyanL);text-decoration:none;font-size:14px;white-space:nowrap}
h1{margin:0;font:900 24px "Zen Maru Gothic";color:var(--core);text-shadow:0 0 10px var(--pink);letter-spacing:.1em}
#tabs{display:flex;gap:8px}
#tabs button{flex:1;padding:7px 4px;border-radius:999px;font-size:14px;color:#a99bb8}
#tabs button.on{border-color:var(--cyanL);color:#fff;box-shadow:0 0 8px var(--cyan)}
#tabs small{font-family:"DotGothic16";color:var(--amber);margin-left:4px}
#bar{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;font:inherit;color:#eee;background:var(--glass);border:2px solid #3a2a48;border-radius:12px;padding:8px 12px;outline:none}
#q:focus{border-color:var(--cyanL)}
#sort,#sk{padding:8px 10px;font-size:13px;color:#a99bb8;white-space:nowrap}
#sk.on{border-color:var(--red);color:var(--red)}
#pw{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:none}
#pw.on{display:block}
#pw iframe,#player{position:absolute;inset:0;width:100%;height:100%}
#now{font-size:13px;color:var(--dim);display:none;align-items:center;gap:8px}
#now.on{display:flex}
#now b{color:var(--core);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now button{padding:4px 10px;font-size:12px;color:var(--dim)}
#sum{font-size:12px;color:var(--dim)}
.grp{margin:14px 0 4px;font-size:12px;color:var(--cyanL);letter-spacing:.1em}
.it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #1e1528}
.it.sk{opacity:.45}
.it .m{flex:1;min-width:0}
.it .s{font-weight:700;color:#fff}
.it .s em{font-style:normal;font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:0 4px;margin-left:6px;vertical-align:2px}
.it .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t{font-size:11px;color:var(--dim);margin-top:2px}
.it .t .num{font-size:12px}
.it .t i{font-style:normal;color:var(--cyanL)}
.it .b{display:flex;gap:6px;flex:none}
.it .b button{padding:6px 10px;font-size:13px}
.it .b .p{border-color:var(--pinkL);color:var(--core)}
.it .b .o{color:var(--cyanL);border-color:#2f5a6a}
.it.cur{background:linear-gradient(90deg,#2a0f2e,transparent)}
#empty{color:var(--dim);text-align:center;padding:40px 0;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <div id="hd"><h1>題庫</h1><span style="flex:1"></span><a href="./">回遊戲 ›</a></div>
    <div id="tabs"><button data-k="bj" class="on">黑杰倫<small></small></button><button data-k="cover">翻唱<small></small></button><button data-k="orig">原唱<small></small></button></div>
    <div id="bar"><input id="q" placeholder="搜尋歌名、原唱" enterkeyhint="search"><button id="sort">依原唱</button><button id="sk">已剔除</button></div>
    <div id="pw"><div id="player"></div></div>
    <div id="now"><b></b><button id="close">收起</button></div>
  </div>
  <div id="sum"></div>
  <div id="list"></div>
  <div id="empty">找不到</div>
</div>
<script>
{
const COVER = ['滾石唱片 ROCK RECORDS', 'Capybara96', 'Priscilla Abby 蔡恩雨', '尋人啟事 The Wanted']; // 跟遊戲的「翻唱」一致
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = t => t == null ? '—' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const SRC = {'滾石唱片 ROCK RECORDS':'滾石致敬', 'Capybara96':'Capybara96', 'Priscilla Abby 蔡恩雨':'蔡恩雨', '尋人啟事 The Wanted':'尋人啟事'};
let ALL = [], ORIG = [], tab = 'bj', byArtist = true, showSkip = false, player = null, ready = false, pending = null, curYt = '';
const firstArtist = a => (a || '').replace(/[（(].*?[）)]/g, '').split(/[、,&/]| feat/)[0].trim() || '其他';
const rows = k => k === 'orig' ? ORIG : ALL.filter(x => k === 'bj' ? x.set === '黑杰倫' : COVER.includes(x.set));
const origOf = song => ORIG.find(o => o.song === song && !o.skip);

function paint() {
  document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', b.dataset.k === tab);
    b.querySelector('small').textContent = rows(b.dataset.k).filter(x => !x.skip).length; });
  const q = $('q').value.trim().toLowerCase();
  const all = rows(tab), skipN = all.filter(x => x.skip).length;
  $('sk').style.display = skipN ? '' : 'none'; $('sk').classList.toggle('on', showSkip); $('sk').textContent = `已剔除 ${skipN}`;
  $('sort').textContent = byArtist ? '依原唱' : '依歌名';
  let r = all.filter(x => showSkip ? x.skip : !x.skip)
             .filter(x => !q || (x.song + ' ' + x.artist).toLowerCase().includes(q));
  const key = x => byArtist ? firstArtist(x.artist) : x.song;
  r.sort((a, b) => key(a).localeCompare(key(b), 'zh-Hant') || a.song.localeCompare(b.song, 'zh-Hant'));
  $('sum').textContent = showSkip ? `已剔除 ${r.length} 首（遊戲不會出）` : q ? `找到 ${r.length} 首` : '';
  $('empty').style.display = r.length ? 'none' : 'block';
  let h = '', last = null;
  for (const x of r) {
    if (byArtist && key(x) !== last) { last = key(x); h += `<div class="grp">${esc(last)}</div>`; }
    h += item(x);
  }
  $('list').innerHTML = h;
}
function item(x) {
  let t;
  if (x.orig) {
    const how = x.manual ? '手動' : x.auto ? '自動' : '';
    t = `前奏 <span class="num">${mmss(x.intro || 0)}</span>　副歌 <span class="num">${mmss(x.start)}</span>${how ? `　<i>${how}</i>` : ''}`;
  } else {
    t = [tab === 'cover' ? SRC[x.set] || x.set : '', x.style, x.year ? `<span class="num">${x.year}</span>` : ''].filter(Boolean).join('・');
  }
  const o = !x.orig && origOf(x.song);
  return `<div class="it${x.skip ? ' sk' : ''}${x.yt === curYt ? ' cur' : ''}" data-yt="${x.yt}">
    <div class="m"><div class="s">${esc(x.song)}${x.skip ? '<em>剔除</em>' : ''}</div>
      <div class="a">${esc(x.artist)}</div><div class="t">${t}</div></div>
    <div class="b">${o ? `<button class="o" data-o="${o.yt}">原曲</button>` : ''}<button class="p" data-p="${x.yt}">▶</button></div></div>`;
}
function play(yt) {
  const v = [...ALL, ...ORIG].find(x => x.yt === yt); if (!v) return;
  const start = v.start != null ? v.start : (v.orig ? v.intro || 0 : 30);
  curYt = yt; $('pw').classList.add('on'); $('now').classList.add('on');
  $('now').querySelector('b').textContent = `${v.song}・${v.orig ? '原唱' : v.style || '改編'}（從 ${mmss(start)} 開始）`;
  if (ready) player.loadVideoById({videoId: yt, startSeconds: start}); else pending = [yt, start];
  paint();
}
$('list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) play(b.dataset.p || b.dataset.o); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.k; showSkip = false; paint(); scrollTo(0, 0); });
$('q').addEventListener('input', paint);
$('sort').onclick = () => { byArtist = !byArtist; paint(); };
$('sk').onclick = () => { showSkip = !showSkip; paint(); };
$('close').onclick = () => { if (ready) player.stopVideo(); curYt = ''; $('pw').classList.remove('on'); $('now').classList.remove('on'); paint(); };

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {width: '100%', height: '100%', playerVars: {playsinline: 1, rel: 0},
    events: {onReady: () => { ready = true; if (pending) player.loadVideoById({videoId: pending[0], startSeconds: pending[1]}); }}});
};
Promise.all([fetch('data/songs.json').then(r => r.json()), fetch('data/orig.json').then(r => r.json())]).then(([s, o]) => {
  ALL = s; ORIG = o; paint();
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
});
}
</script>
</body>
</html>
