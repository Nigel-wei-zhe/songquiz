<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050C">
<title>題庫・原曲是哪首？</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050C;--glass:#120A1A;--glass2:#1a1024;--line:#2a1d36;--pink:#ff2fae;--pinkL:#ff8ad8;--core:#fff6fc;--cyan:#14c8ff;--cyanL:#7fe9ff;--amber:#ffc35a;--red:#ff4d5e;
  --tx2:#b3a6c4;--tx3:#8f82a3;--pt:env(safe-area-inset-top);--pb:env(safe-area-inset-bottom);--dock:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-color:#3a2a48 var(--bg)}
::selection{background:#ff2fae55;color:#fff}
body{margin:0;background:var(--bg);color:#eee;font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;padding-bottom:calc(24px + var(--pb) + var(--dock))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cyanL);outline-offset:2px;border-radius:10px}
svg{display:block;flex:none}
.num{font-family:"DotGothic16",monospace;color:var(--amber);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---- 頂部 ---- */
#top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,#07050C00);padding:calc(8px + var(--pt)) 0 10px}
#hd{display:flex;align-items:center;gap:6px;height:44px}
#back{width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;color:var(--tx2);border-radius:50%}
#back:active{background:var(--glass2)}
h1{margin:0;font:900 24px/1 "Zen Maru Gothic";color:var(--core);letter-spacing:.12em;text-shadow:0 0 6px var(--pink),0 0 18px #ff2fae88}
#total{margin-left:auto;font-size:12px;color:var(--tx3)}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin-top:6px;background:var(--glass);border:1px solid var(--line);border-radius:14px}
#tabs button{height:38px;border-radius:10px;color:var(--tx2);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s,box-shadow .2s}
#tabs button small{font:12px "DotGothic16";color:var(--tx3);transition:color .2s}
#tabs button.on{color:#fff;background:#25102d;box-shadow:inset 0 0 0 1.5px var(--pinkL),0 0 12px #ff2fae55}
#tabs button.on small{color:var(--amber)}
#bar{display:flex;gap:8px;margin-top:10px}
#qw{flex:1;min-width:0;position:relative;display:flex;align-items:center}
#qw>svg{position:absolute;left:12px;color:var(--tx3);pointer-events:none}
#q{width:100%;height:42px;font:inherit;color:#fff;caret-color:var(--pinkL);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:0 38px 0 38px;outline:none;transition:border-color .2s}
#q::placeholder{color:var(--tx3)}
#q:focus{border-color:var(--cyanL)}
#q::-webkit-search-cancel-button{display:none}
#qx{position:absolute;right:4px;width:34px;height:34px;display:none;place-items:center;color:var(--tx3)}
#qw.has #qx{display:grid}
#sort{height:42px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);background:var(--glass);border:1px solid var(--line);border-radius:12px;white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none;mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;height:30px;padding:0 11px;border-radius:999px;font-size:13px;color:var(--tx2);background:var(--glass);border:1px solid var(--line)}
#chips button small{font:11px "DotGothic16";color:var(--tx3);margin-left:4px}
#chips button:active{border-color:var(--cyanL)}

/* ---- 剔除檢視 ---- */
#skb{display:none;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid #5a2030;background:#1a0a10;border-radius:12px;font-size:13px;color:#ffb3bc}
#skb button{margin-left:auto;color:#fff;font-size:13px;display:flex;align-items:center;gap:2px}
body.skipv #skb{display:flex}
body.skipv #bar,body.skipv #chips{display:none}

/* ---- 列表 ---- */
.grp{display:flex;align-items:center;gap:8px;margin:20px 0 2px;scroll-margin-top:var(--tophgt,170px)}
.grp b{font-size:13px;font-weight:700;color:var(--cyanL);letter-spacing:.06em}
.grp .num{font-size:12px}
.grp::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#14c8ff55,transparent)}
.it{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 0;border-bottom:1px solid #1a1222;cursor:pointer}
.it .m{flex:1;min-width:0}
.it .s{font-size:16px;font-weight:700;color:#fff;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .a{font-size:13px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--tx3)}
.it .t .num{font-size:13px;margin-left:3px}
.tag{padding:0 6px;border-radius:6px;background:#1c1328;color:var(--tx2);font-size:11px;line-height:18px}
.tag.c{background:#0c2430;color:var(--cyanL)}
.tag.p{background:#2a0f24;color:var(--pinkL)}
.ob{flex:none;height:32px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--cyanL);border:1px solid #1f4f60;display:flex;align-items:center;gap:4px}
.ob:active{background:#0c2430}
.pb{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--pinkL);border:1.5px solid #6a2a58;transition:border-color .2s,box-shadow .2s,background .2s}
.it:active .pb{background:#2a0f24}
.it.cur .s{color:var(--core);text-shadow:0 0 10px #ff2fae99}
.it.cur .pb{border-color:var(--pinkL);box-shadow:0 0 12px #ff2fae77;background:#25102d}
.it.sk .s,.it.sk .a{color:var(--tx3)}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--pinkL);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:18px;height:44px;font-size:13px;color:var(--tx3);border:1px dashed var(--line);border-radius:12px}
#msg{text-align:center;color:var(--tx3);padding:56px 0;font-size:14px}
#msg button{display:block;margin:14px auto 0;padding:8px 18px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}

/* ---- 播放列 ---- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:9;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#dock.on{transform:none}
#dock .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:12px 16px calc(12px + var(--pb));background:#0d0814f2;border-top:1px solid #6a2a58;box-shadow:0 -1px 0 #ff2fae44,0 -10px 30px #000a;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#pw{position:relative;width:144px;height:81px;flex:none;border-radius:10px;overflow:hidden;background:#000}
#pw iframe,#player{position:absolute;inset:0;width:100%;height:100%}
#di{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#dn{font:900 17px/1.2 "Zen Maru Gothic";color:var(--core);text-shadow:0 0 8px #ff2fae88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ds{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dc{display:flex;gap:6px;align-items:center}
#dc button{height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px}
#dplay{width:32px;background:var(--pink);color:#fff;box-shadow:0 0 10px #ff2fae88}
#dsw{padding:0 10px;color:var(--cyanL);border:1px solid #1f4f60}
#dx{width:32px;margin-left:auto;color:var(--tx3)}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}#dock{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="top">
    <div id="hd">
      <a id="back" href="./" aria-label="回遊戲"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1>題庫</h1><span id="total"></span>
    </div>
    <div id="tabs" role="tablist"><button data-k="bj" class="on" role="tab">黑杰倫<small></small></button><button data-k="cover" role="tab">翻唱<small></small></button><button data-k="orig" role="tab">原唱<small></small></button></div>
    <div id="bar">
      <label id="qw"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="搜尋歌名、原唱" enterkeyhint="search" autocomplete="off">
        <button id="qx" type="button" aria-label="清除搜尋"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label>
      <button id="sort"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg><span></span></button>
    </div>
    <div id="chips"></div>
    <div id="skb"><span>已剔除的歌，遊戲不會出</span><button id="skx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>返回</button></div>
  </div>
  <div id="list"><div id="msg">整理題庫中…</div></div>
</div>

<div id="dock" aria-live="polite"><div class="in">
  <div id="pw"><div id="player"></div></div>
  <div id="di"><div id="dn"></div><div id="ds"></div>
    <div id="dc"><button id="dplay" aria-label="暫停"></button><button id="dsw"></button>
      <button id="dx" aria-label="關閉播放"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
</div></div>
<script>
{
const COVER = ['滾石唱片 ROCK RECORDS', 'Capybara96', 'Priscilla Abby 蔡恩雨', '尋人啟事 The Wanted']; // 跟遊戲的「翻唱」一致
const SRC = {'滾石唱片 ROCK RECORDS':'滾石致敬', 'Capybara96':'Capybara96', 'Priscilla Abby 蔡恩雨':'蔡恩雨', '尋人啟事 The Wanted':'尋人啟事'};
const I = {
  play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  eq: '<span class="eq"><i></i><i></i><i></i></span>',
  swap: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = t => t == null ? '—' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const firstArtist = a => (a || '').replace(/[（(].*?[）)]/g, '').split(/[、,&/]| feat/)[0].trim() || '其他';
let ALL = [], ORIG = [], tab = 'bj', byArtist = true, skipView = false;
let player = null, ready = false, pending = null, cur = null, playing = false;
const rows = k => k === 'orig' ? ORIG : ALL.filter(x => k === 'bj' ? x.set === '黑杰倫' : COVER.includes(x.set));
const origOf = song => ORIG.find(o => o.song === song && !o.skip);
const coverOf = song => ALL.find(x => x.song === song && !x.skip);
const startOf = v => v.start != null ? v.start : (v.orig ? v.intro || 0 : 30);
const find = yt => ALL.find(x => x.yt === yt) || ORIG.find(x => x.yt === yt);

function paint() {
  document.body.classList.toggle('skipv', skipView);
  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.k === tab;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    b.querySelector('small').textContent = rows(b.dataset.k).filter(x => !x.skip).length; });
  $('sort').querySelector('span').textContent = byArtist ? '依原唱' : '依歌名';
  const q = $('q').value.trim().toLowerCase();
  $('qw').classList.toggle('has', !!q);
  const all = rows(tab), live = all.filter(x => !x.skip), skipN = all.length - live.length;
  let r = (skipView ? all.filter(x => x.skip) : live).filter(x => !q || (x.song + ' ' + x.artist).toLowerCase().includes(q));
  const grouped = byArtist && !q;
  const key = x => grouped ? firstArtist(x.artist) : x.song;
  r.sort((a, b) => key(a).localeCompare(key(b), 'zh-Hant') || a.song.localeCompare(b.song, 'zh-Hant'));
  const groups = new Map(); if (grouped) r.forEach(x => groups.set(key(x), (groups.get(key(x)) || 0) + 1));
  $('total').innerHTML = `<span class="num">${live.length}</span> 首・<span class="num">${new Set(live.map(x => firstArtist(x.artist))).size}</span> 位原唱`;
  $('chips').style.display = grouped && !skipView && groups.size > 1 ? '' : 'none';
  $('chips').innerHTML = [...groups].map(([g, n], i) => `<button data-g="${i}">${esc(g)}<small>${n}</small></button>`).join('');
  let h = '', last = null, gi = -1;
  for (const x of r) {
    if (grouped && key(x) !== last) { last = key(x); gi++; h += `<div class="grp" id="g${gi}"><b>${esc(last)}</b><span class="num">${groups.get(last)}</span></div>`; }
    h += item(x, grouped);
  }
  if (!r.length) h = q ? `<div id="msg">找不到「${esc($('q').value.trim())}」<button data-clear>清除搜尋</button></div>` : '<div id="msg">這裡沒有歌</div>';
  if (!skipView && skipN && !q) h += `<button id="more">已剔除的 <span class="num">${skipN}</span> 首 ${I.chev}</button>`;
  $('list').innerHTML = h;
  document.documentElement.style.setProperty('--tophgt', $('top').offsetHeight + 'px');
}
function item(x, grouped) {
  let t;
  if (x.skip) t = ''; // 剔除檢視上方已經說明，秒數不重要
  else if (x.orig) t = `<span>前奏<span class="num">${mmss(x.intro || 0)}</span></span><span>副歌<span class="num">${mmss(x.start)}</span></span>`
    + (x.manual ? '<span class="tag p">手動標</span>' : x.auto ? '<span class="tag">自動估</span>' : '');
  else t = (tab === 'cover' ? `<span class="tag c">${esc(SRC[x.set] || x.set)}</span>` : '')
    + `<span>${esc(x.style || '改編')}</span>` + (x.year ? `<span class="num" style="margin:0">${x.year}</span>` : '');
  const o = !x.orig && origOf(x.song), isCur = cur && cur.yt === x.yt;
  return `<div class="it${x.skip ? ' sk' : ''}${isCur ? ' cur' : ''}${isCur && !playing ? ' paused' : ''}" data-yt="${x.yt}">
    <div class="m"><div class="s">${esc(x.song)}</div>${grouped ? '' : `<div class="a">${esc(x.artist)}</div>`}${t ? `<div class="t">${t}</div>` : ''}</div>
    ${o ? `<button class="ob" data-o="${o.yt}" aria-label="聽「${esc(x.song)}」原曲">原曲</button>` : ''}
    <span class="pb" aria-hidden="true">${isCur ? (playing ? I.eq : I.play) : I.play}</span></div>`;
}
function dockPaint() {
  if (!cur) return;
  const other = cur.orig ? coverOf(cur.song) : origOf(cur.song);
  $('dn').textContent = cur.song;
  $('ds').textContent = `${cur.orig ? '原唱' : (SRC[cur.set] || cur.set) + '改編'}・${cur.artist}・從 ${mmss(startOf(cur))} 播`;
  $('dplay').innerHTML = playing ? I.pause : I.play; $('dplay').setAttribute('aria-label', playing ? '暫停' : '播放');
  $('dsw').style.display = other ? '' : 'none';
  $('dsw').innerHTML = `${I.swap}${cur.orig ? '聽改編' : '聽原曲'}`; $('dsw').dataset.yt = other ? other.yt : '';
}
function play(yt) {
  const v = find(yt); if (!v) return;
  if (cur && cur.yt === yt && ready) return toggle();
  cur = v; playing = true;
  $('dock').classList.add('on');
  requestAnimationFrame(() => document.documentElement.style.setProperty('--dock', $('dock').offsetHeight + 'px'));
  if (ready) player.loadVideoById({videoId: yt, startSeconds: startOf(v)}); else pending = yt;
  dockPaint(); paint();
}
function toggle() { if (!ready) return; playing ? player.pauseVideo() : player.playVideo(); }
function close() {
  if (ready) player.stopVideo(); cur = null; playing = false;
  $('dock').classList.remove('on'); document.documentElement.style.setProperty('--dock', '0px'); paint();
}

$('list').addEventListener('click', e => {
  if (e.target.closest('[data-clear]')) { $('q').value = ''; paint(); return; }
  if (e.target.closest('#more')) { skipView = true; paint(); scrollTo(0, 0); return; }
  const o = e.target.closest('[data-o]'); if (o) return play(o.dataset.o);
  const it = e.target.closest('.it'); if (it) play(it.dataset.yt);
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.k === tab) return; tab = b.dataset.k; skipView = false; paint(); scrollTo(0, 0); });
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) $('g' + b.dataset.g)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); });
$('q').addEventListener('input', paint);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('qx').onclick = e => { e.preventDefault(); $('q').value = ''; paint(); $('q').focus(); };
$('sort').onclick = () => { byArtist = !byArtist; paint(); };
$('skx').onclick = () => { skipView = false; paint(); };
$('dplay').onclick = toggle;
$('dsw').onclick = () => { if ($('dsw').dataset.yt) play($('dsw').dataset.yt); };
$('dx').onclick = close;

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {width: '100%', height: '100%', playerVars: {playsinline: 1, rel: 0, controls: 0},
    events: {
      onReady: () => { ready = true; if (pending) { player.loadVideoById({videoId: pending, startSeconds: startOf(find(pending))}); pending = null; } },
      onStateChange: e => { const p = e.data === 1 || e.data === 3; if (p !== playing && cur) { playing = p; dockPaint(); paint(); } },
    }});
};
Promise.all([fetch('data/songs.json').then(r => r.json()), fetch('data/orig.json').then(r => r.json())]).then(([s, o]) => {
  ALL = s; ORIG = o; paint();
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
}).catch(() => { $('list').innerHTML = '<div id="msg">題庫讀不到，請重新整理<button onclick="location.reload()">重新整理</button></div>'; });
}
</script>
</body>
</html>
